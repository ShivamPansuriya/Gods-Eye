<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.PageTitle}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a review path. Story first (why/what/impact), then one unit at a time
   with a single question to decide, then a summary that writes the review. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --side:#eceef2; --ink:#14171c; --muted:#5b6270; --faint:#959cab;
  --line:#dde1e7; --hover:#e5e8ee;
  --iris:#2d55c6; --iris-bg:#e8edfb; --iris-ink:#ffffff;
  --human:#a12d7a; --human-bg:#f6e6f0; --agent:#1f6b8c; --agent-bg:#e2f0f6; --static:#56663f; --static-bg:#ecf0e4;
  --add:#e5f4ea; --add-ink:#1b6b37; --add-gut:#cbe9d4; --del:#fbe8e8; --del-ink:#a3262b; --del-gut:#f2cfcf;
  --ok:#237a49; --ok-bg:#e3f3e9; --bad:#b42a24; --bad-bg:#fbe9e7; --warn:#9a6210; --warn-bg:#fbf1df; --hl:#e3a72a;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 6px 24px rgba(20,23,28,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --panel:#171a20; --side:#13161b; --ink:#e8eaee; --muted:#a3aab7; --faint:#6b7280;
  --line:#272b33; --hover:#1f232a; --iris:#86a2f7; --iris-bg:#1c2440; --iris-ink:#0d1120;
  --human:#e58ac6; --human-bg:#2d1a27; --agent:#7cc3e3; --agent-bg:#15262f; --static:#b2c58f; --static-bg:#1c2317;
  --add:#13281b; --add-ink:#8fd8a5; --add-gut:#1a3424; --del:#2d1718; --del-ink:#f1a0a0; --del-gut:#3a1e1f;
  --ok:#6fcf97; --ok-bg:#15291d; --bad:#f28b82; --bad-bg:#2e1716; --warn:#f0bd62; --warn-bg:#2a2214; --hl:#d9a33a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --panel:#171a20; --side:#13161b; --ink:#e8eaee; --muted:#a3aab7; --faint:#6b7280;
  --line:#272b33; --hover:#1f232a; --iris:#86a2f7; --iris-bg:#1c2440; --iris-ink:#0d1120;
  --human:#e58ac6; --human-bg:#2d1a27; --agent:#7cc3e3; --agent-bg:#15262f; --static:#b2c58f; --static-bg:#1c2317;
  --add:#13281b; --add-ink:#8fd8a5; --add-gut:#1a3424; --del:#2d1718; --del-ink:#f1a0a0; --del-gut:#3a1e1f;
  --ok:#6fcf97; --ok-bg:#15291d; --bad:#f28b82; --bad-bg:#2e1716; --warn:#f0bd62; --warn-bg:#2a2214; --hl:#d9a33a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:12.5px}
a{color:inherit}
h1,h2,.display{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance}
.lbl{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:12px;height:52px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:700 16px var(--display);display:flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none}
.brand svg{width:20px;height:20px;color:var(--iris)}
.crumbs{color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sha{font-family:var(--mono);font-size:11.5px;background:var(--side);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.grow{flex:1}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--iris);transition:width .4s ease}
.chip{font-size:12.5px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:5px 7px;color:var(--muted);display:inline-flex}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.menu{display:none}

/* layout */
.wrap{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 10px 110px;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px - env(safe-area-inset-top,0px));overflow:auto}
.main{padding:32px max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px));max-width:1080px;width:100%;margin:0 auto;min-width:0}
.main>*{max-width:100%}
.main p,.main li,.bug,.imp,.ln p,.chk p,.prow .q,.lead,.brief{overflow-wrap:anywhere}

.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--muted);text-decoration:none}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav .t{font-weight:500;line-height:1.3;color:var(--ink)}
.side h4{margin:18px 10px 8px;display:flex;justify-content:space-between}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;margin:1px 0}
.step:hover{background:var(--hover)}
.step.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--mono);border:1.5px solid var(--line);color:var(--muted);background:var(--panel)}
.num.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.num.change{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.num.ask{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.step .t{font-weight:500;line-height:1.3}
.step .m{grid-column:2;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.r-high{background:var(--bad)} .r-medium{background:var(--warn)} .r-low{background:var(--faint)}
.flag{font-size:11px;color:var(--bad);border:1px solid currentColor;border-radius:4px;padding:0 4px;white-space:nowrap}
.flag.minor{color:var(--warn)}

.tag{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.tag.human{color:var(--human);background:var(--human-bg)} .tag.agent{color:var(--agent);background:var(--agent-bg)} .tag.static{color:var(--static);background:var(--static-bg)}
.tag.stated{color:var(--ok);background:var(--ok-bg)} .tag.inferred{color:var(--warn);background:var(--warn-bg)}

/* story */
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13.5px}
.eyebrow .mono{font-size:12.5px}
h1{font-size:clamp(28px,4.2vw,42px);line-height:1.08;margin:14px 0 14px;font-weight:700}
.lead{font-size:19px;line-height:1.55;max-width:760px;margin:0 0 26px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px;min-width:0}
.grid2>.card{margin:0}
.card>h3,.card>header{margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card>h3{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0}
.ba{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:baseline}
.ba .lbl{padding-top:3px}
.ba .after{font-weight:500}
.impact{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.who{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.who h4{margin:0 0 8px;font:600 13px var(--display);letter-spacing:0;display:flex;gap:6px;align-items:center}
.imp{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;padding:6px 0;border-top:1px dashed var(--line)}
.imp:first-of-type{border-top:0;padding-top:0}
.kind{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 12px var(--mono);margin-top:2px}
.kind.added{background:var(--add);color:var(--add-ink)} .kind.changed{background:var(--iris-bg);color:var(--iris)} .kind.removed{background:var(--del);color:var(--del-ink)} .kind.risk{background:var(--warn-bg);color:var(--warn)}
.imp b{font-weight:600;font-size:13.5px}
.imp span{color:var(--muted);font-size:13.5px}
.focus{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.focus li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.focus svg{color:var(--iris);margin-top:3px}

/* start panel */
.start{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 26px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:8px 0 22px;box-shadow:var(--shadow)}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--iris);transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 24px var(--display);font-variant-numeric:tabular-nums}
.ring b small{display:block;font:500 11px var(--sans);color:var(--muted);text-align:center;margin-top:-4px}
.start h2{margin:0 0 6px;font-size:24px}
.start p{margin:0;color:var(--muted)}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--iris);color:var(--iris-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px}
.cta:hover{filter:brightness(1.08)}
.cta.ghost{background:none;color:var(--iris);border:1px solid var(--iris)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted);background:var(--bg)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.card.gaps{border-color:var(--bad);background:var(--bad-bg)}
.mrisk{padding:0;overflow:hidden}
.mrisk .mhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mrisk .grade{font:700 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border-radius:8px}
.lv-low,.lv0{color:var(--ok);background:var(--ok-bg)} .lv-medium,.lv1{color:var(--warn);background:var(--warn-bg)} .lv-high,.lv2{color:var(--bad);background:var(--bad-bg)}
.mrisk .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.mrisk .meter i{display:block;height:100%;border-radius:3px}
.mrisk .sig{display:grid;grid-template-columns:24px 130px 92px minmax(0,1fr);gap:4px 12px;align-items:start;padding:11px 20px;border-bottom:1px solid var(--line)}
.mrisk .sig:last-of-type{border-bottom:0}
.mrisk .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px/1 var(--mono)}
.mrisk .sig .nm{font-weight:600} .mrisk .sig .gr{font:600 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.05em}
.mrisk .sig .why{color:var(--muted);overflow-wrap:anywhere}
.mrisk .claims{grid-column:2/-1;display:grid;gap:6px;margin-top:4px}
.mrisk .claim{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;overflow-wrap:anywhere}
.mrisk .claim.rej{opacity:.65} .mrisk .claim.rej>b{text-decoration:line-through}
.mrisk details.dis summary{cursor:pointer;color:var(--muted);font-size:13px;list-style-position:inside}
.mrisk details.dis[open]{display:grid;gap:6px}
.mrisk .lower{padding:12px 20px;background:var(--bg);border-top:1px solid var(--line);font-size:14px}
.mrisk .lower ul{margin:6px 0 0;padding-left:18px}
@media (max-width:640px){.mrisk .sig{grid-template-columns:24px minmax(0,1fr) auto}.mrisk .sig .why{grid-column:2/-1}.mrisk .claims{grid-column:1/-1}}

.path{display:grid;gap:2px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow:hover .t{text-decoration:underline}
.prow .q{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}

/* unit */
.stephead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.change{background:var(--bad)} .dots i.ask{background:var(--warn)} .dots i.cur{outline:2px solid var(--iris);outline-offset:1px}
.sub{color:var(--muted);font-size:13.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.plus{color:var(--add-ink);font-family:var(--mono);font-size:12.5px} .minus{color:var(--del-ink);font-family:var(--mono);font-size:12.5px}

.call{border:1.5px solid var(--iris);background:linear-gradient(0deg,var(--panel),var(--panel)) padding-box;border-radius:16px;padding:18px 20px;margin:18px 0 8px;box-shadow:var(--shadow)}
.call .q{font:600 21px/1.35 var(--display);margin:8px 0 14px;letter-spacing:-.01em}
.decide{display:flex;flex-wrap:wrap;gap:8px}
.dbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-weight:500}
.dbtn kbd{font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dbtn:hover{border-color:var(--ink)}
.dbtn.ok.on{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dbtn.change.on{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.dbtn.ask.on{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.dbtn.on kbd{color:inherit;border-color:currentColor}
.note{width:100%;margin-top:12px;min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical;font-size:14px}
.saved{font-size:12.5px;color:var(--ok);margin-left:8px}

.views{display:inline-flex;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:3px;margin:18px 0 18px;max-width:100%;overflow-x:auto}
.views button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.views button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bars{display:inline-flex;gap:1.5px;align-items:flex-end;height:11px}
.bars i{width:2.5px;background:currentColor;border-radius:1px;opacity:.3}
.bars i.f{opacity:1}
.brief{font-size:17px;line-height:1.65;margin:0 0 20px;max-width:760px}
mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--hl);text-decoration-thickness:2px;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.cols>.card{margin:0}

/* flow */
.flow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.st{font-family:var(--mono);font-size:12.5px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
button.st:hover{border-color:var(--iris)}
.st.added{background:var(--add);color:var(--add-ink);border-color:transparent}
.st.removed{background:var(--del);color:var(--del-ink);border-color:transparent;text-decoration:line-through}
.st.changed{background:var(--iris-bg);color:var(--iris);border-color:transparent}
.arr{color:var(--faint);font-size:12px;display:flex;align-items:center;gap:4px}
.arr em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{color:var(--faint);font-size:13.5px}

.ln{padding:10px 0;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0;padding-top:0}
.ln .h{display:flex;justify-content:space-between;gap:8px}
.ln code{background:var(--iris-bg);padding:1px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ln .go{font-family:var(--mono);font-size:11.5px;color:var(--faint);background:none;border:0;padding:0}
.ln .go:hover{color:var(--iris)}
.ln p{margin:4px 0 0;color:var(--muted);font-size:14px}

.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0;padding-top:2px}
.ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.ic.done{color:var(--ok)} .ic.not_done{color:var(--bad)} .ic.no_evidence{color:var(--warn);border:1.5px solid currentColor;width:16px;height:16px}
.chk .c{font-weight:600}
.stt{font:500 11px var(--mono);margin-left:8px;white-space:nowrap}
.stt.done{color:var(--ok)} .stt.not_done{color:var(--bad)} .stt.no_evidence{color:var(--warn)}
.chk p{margin:2px 0 6px;color:var(--muted);font-size:14px}
.ev{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
button.ev:hover{border-color:var(--iris)}
.ev b{font-weight:600;font-family:var(--mono);font-size:11px;white-space:nowrap}
.src{font-size:11.5px;color:var(--faint);margin-left:6px}
.bl{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;padding:8px 0}
.bl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.askc{background:var(--warn-bg);border-color:transparent}
.askc ol{margin:6px 0 0;padding-left:20px} .askc li{margin:4px 0}

/* bugs */
.bugs{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.bug{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.bug:first-of-type{border-top:0;padding-top:2px}
.sev{font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:5px;height:max-content;white-space:nowrap}

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.review, META = D.meta;
const STORY = R.story || {};
const HUNKS = {}, FILE_OF = {};
D.files.forEach(f => (f.hunks||[]).forEach(h => { HUNKS[h.id] = h; FILE_OF[h.id] = f; }));
const TIER = {human:"Needs your decision", agent:"Agent reviewed", static:"Static / CI"};
const VIEWS = [["facts","Facts",1],["briefed","Briefed",2],["explained","Explained",3],["guided","Guided",4]];
const KEY = "godseye:" + (META.repo||"") + ":" + (META.number||"") + ":" + (META.headSha||"");
const FINDINGS = R.findings||[]; const FBY = {}; FINDINGS.forEach(f=>FBY[f.id]=f);
const PIPE = R.pipeline||null;

const store = {
  get(k, d){ try { const v = localStorage.getItem(KEY+":"+k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(KEY+":"+k, JSON.stringify(v)); } catch(e){} }
};
let route = "story";               // "story" | "summary" | unit id
let view = store.get("view","guided");
let decisions = store.get("decisions", {});  // unit id -> {d: ok|change|ask, note}
let agree = store.get("agree", {});          // finding id -> y|n
let started = store.get("started", 0);
let fdec = store.get("fdec", {});   // foundation id -> now | follow | none
let pask = store.get("pask", {});   // practice id -> true (ask to fix)
let seen = store.get("seen", {});
const DESIGN = R.design || null, ATTR = R.attribution || null;
const FITEMS = DESIGN ? (DESIGN.foundations.items||[]).filter(f=>f.status==="confirmed") : [];
const PRACS = DESIGN ? (DESIGN.practices||[]) : [];
const HAS_BASE = !!DESIGN && (FITEMS.length + PRACS.length > 0 || !!DESIGN.foundations.summary);
let archMode = "changes", archUml = false, archSel = null, flowIdx = 0, flowMode = "after", flowCur = 0, flowTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tierRank = t => ({human:2,agent:1,static:0}[t]||0), riskRank = r => ({high:2,medium:1,low:0}[r]||0);
const units = R.units.slice().sort((a,b) => tierRank(b.tier)-tierRank(a.tier) || riskRank(b.risk)-riskRank(a.risk));
const totals = D.files.reduce((t,f)=>({a:t.a+f.adds,d:t.d+f.dels}),{a:0,d:0});
function stats(u){ let a=0,d=0; u.hunks.forEach(id=>{const h=HUNKS[id]; if(h){a+=h.adds;d+=h.dels}}); return {a,d} }
function bugsOf(u){ return (u.findings||[]).map(id=>FBY[id]).filter(f=>f && f.status==="confirmed") }
function blocking(u){ return bugsOf(u).filter(f=>f.introduced && f.severity!=="minor") }
function openBugs(u){ return bugsOf(u).filter(f=>f.introduced && !agree[f.id]) }
function total(){ return units.length + FITEMS.length }
function baseOpen(){ return FITEMS.filter(f=>!fdec[f.id]).length }
function decidedUnits(){ return units.filter(u=>decisions[u.id] && decisions[u.id].d).length }
function decided(){ return decidedUnits() + FITEMS.filter(f=>fdec[f.id]).length }
function unitOfFile(path){ for (const u of units) for (const h of u.hunks) { const f = FILE_OF[h]; if (f && f.path===path) return [u, h]; } return [null, null] }
function unitOfHunk(hk){ return units.find(u=>u.hunks.includes(hk)) || null }
function startTarget(){ if (DESIGN && !seen.design) return "design"; const nx = nextUndecided(); if (nx) return nx.id; if (HAS_BASE && baseOpen()) return "base"; return "summary" }
function brief(s){ return esc(s).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>") }
function bars(n){ let s='<span class="bars">'; for(let i=1;i<=4;i++) s+=`<i class="${i<=n?'f':''}" style="height:${3+i*2}px"></i>`; return s+'</span>' }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2400) }
function copy(text, msg){
  const fallback = () => { const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy") }catch(e){} ta.remove(); toast(ok ? msg : "Copy is blocked here. Select the text and copy it.") };
  try { navigator.clipboard.writeText(text).then(()=>toast(msg), fallback) } catch(e){ fallback() }
}
function shq(s){ return "'" + s.replace(/'/g, "'\\''") + "'" }
function mins(ms){ const m = Math.max(1, Math.round(ms/60000)); return m + " min" }
const EYE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const DEC = {ok:["Looks right","a"], change:["Needs change","c"], ask:["Ask author","q"]};
const NUMMARK = {ok:"✓", change:"✕", ask:"?"};

/* ---------- header ---------- */
$("#crumbs").innerHTML = `<span class="hide-sm">${esc(META.repo||"local")}</span><span class="hide-sm">/</span><b>${META.number?"#"+META.number+" ":""}${esc(R.title||META.title)}</b>${META.headSha?`<span class="sha hide-sm">${esc(META.headSha.slice(0,7))}</span>`:""}`;
$("#theme").onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; try{localStorage.setItem("godseye:theme", r.dataset.theme)}catch(e){} };
try { const t=localStorage.getItem("godseye:theme"); if(t) document.documentElement.dataset.theme=t } catch(e){}
$("#menu").onclick = () => document.body.classList.toggle("navopen");
function renderProgress(){
  const n = decided(), t = total();
  $("#prog").textContent = `${n}/${t} decided`;
  $("#progbar").style.width = (t ? n/t*100 : 0) + "%";
}

/* ---------- side: the review path ---------- */
function renderSide(){
  let h = `<a class="nav ${route==="story"?"on":""}" href="#story">${EYE}<span class="t">The story of this PR</span></a>`;
  if (DESIGN) h += `<a class="nav ${route==="design"?"on":""}" href="#design"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/><path d="M10 6h4a3 3 0 0 1 3 3v6"/></svg><span class="t">How it's built</span></a>`;
  h += `<h4 class="lbl"><span>Your review path</span><span>${decidedUnits()}/${units.length}</span></h4>`;
  units.forEach((u,i) => {
    const dc = (decisions[u.id]||{}).d, s = stats(u), nb = blocking(u).length, nm = bugsOf(u).filter(f=>f.introduced&&f.severity==="minor").length;
    h += `<button class="step ${route===u.id?"on":""}" data-u="${u.id}"><span class="num ${dc||""}">${dc?NUMMARK[dc]:i+1}</span><span class="t">${esc(u.title)}</span><span class="m"><span class="dot r-${u.risk}" title="${u.risk} risk"></span>${u.tier==="human"?"you decide":u.tier==="agent"?"agent reviewed":"CI only"} · <span class="plus">+${s.a}</span><span class="minus">−${s.d}</span>${nb?`<span class="flag">${nb} bug${nb>1?"s":""}</span>`:nm?`<span class="flag minor">${nm} minor</span>`:""}</span></button>`;
  });
  if (HAS_BASE) { const ob = baseOpen(), br = PRACS.filter(p=>p.status!=="followed"&&p.state!=="resolved").length; h += `<h4 class="lbl"><span>The base</span><span>${FITEMS.length-ob}/${FITEMS.length}</span></h4><a class="nav ${route==="base"?"on":""}" href="#base"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 21h18M5 21V10l7-6 7 6v11"/><path d="M10 21v-6h4v6"/></svg><span class="t">Is the existing design right?</span>${ob?`<span class="flag">${ob} to decide</span>`:br?`<span class="flag minor">${br} practice${br>1?"s":""}</span>`:""}</a>`; }
  h += `<h4 class="lbl"><span>Finish</span></h4><a class="nav ${route==="summary"?"on":""}" href="#summary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg><span class="t">Summary and post review</span></a>`;
  $("#side").innerHTML = h;
  $("#side").querySelectorAll("[data-u]").forEach(b => b.onclick = () => go(b.dataset.u));
}

/* ---------- story ---------- */
function ring(n, t, big){
  const r = 46, c = 2*Math.PI*r, off = c * (1 - (t ? n/t : 0));
  return `<div class="ring ${n===t&&t?"done-ring":""}" ${big?'style="width:132px;height:132px"':''}><svg viewBox="0 0 108 108"><circle class="bgc" cx="54" cy="54" r="${r}" fill="none" stroke-width="9"/><circle class="fgc" cx="54" cy="54" r="${r}" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><b><span>${n}/${t}<small>decided</small></span></b></div>`;
}
function renderStory(){
  const conf = FINDINGS.filter(f=>f.status==="confirmed"&&f.introduced);
  const nb = conf.filter(f=>f.severity!=="minor").length, nm = conf.length - nb;
  const n = decided(), next = nextUndecided();
  let h = `<div class="eyebrow">${META.number?`<span class="mono">PR #${META.number}</span>`:""}<span>${esc(META.repo||"")}</span><span>${D.files.length} files</span><span><span class="plus">+${totals.a}</span> <span class="minus">−${totals.d}</span></span><span>${units.length} behaviour changes</span></div>`;
  h += `<h1>${esc(R.title)}</h1>`;
  h += `<p class="lead">${esc(STORY.what || R.eli5)}</p>`;
  if (ATTR && ATTR.agent) h += `<div class="attr" style="margin:-10px 0 22px"><b>${EYE} Written with an AI agent${ATTR.tool?` (${esc(ATTR.tool)})`:""}</b><span>${ATTR.reviewed==="yes"?"The author says they reviewed it.":ATTR.reviewed==="no"?"The author says they have not reviewed it yet: you are the first reviewer.":"The author has not said whether they reviewed it: treat yourself as the first reviewer."}</span></div>`;
  h += gapsBanner();
  h += mergeRiskCard();
  h += `<div class="grid2"><div class="card"><header><span class="lbl">Why this PR exists</span>${STORY.why_basis?`<span class="tag ${STORY.why_basis}">${STORY.why_basis==="stated"?"from the PR":"inferred from code"}</span>`:""}</header><p>${esc(STORY.why || "Not stated.")}</p></div>`;
  h += `<div class="card"><header><span class="lbl">Before → after</span></header><div class="ba"><span class="lbl">Before</span><span>${esc(STORY.before||"—")}</span><span class="lbl">After</span><span class="after">${esc(STORY.after||"—")}</span></div></div></div>`;
  // Your review
  const eta = STORY.review_mins || Math.max(3, units.length*2), T = total();
  const miss = units.filter(u=>u.evidence&&u.evidence.status==="missing").length;
  const cta = n===T ? `<button class="cta" data-go="summary">See your review →</button>` : `<button class="cta" data-go="${startTarget()}">${n?"Continue review":DESIGN?"Start: see how it's built":"Start review"} →</button>`;
  h += `<section class="start">${ring(n, T)}<div><h2>${n===T?"All decisions made":n?`${T-n} decisions to go`:`Your review: ${T} decisions, about ${eta} min`}</h2><p>${units.filter(u=>u.tier==="human").length} need your judgement; the rest were checked by agents and CI. Each step asks you one question.</p><div class="stats">${nb?`<span class="stat bad"><b>${nb}</b> verified bug${nb>1?"s":""} to confirm</span>`:""}${nm?`<span class="stat"><b>${nm}</b> minor</span>`:""}${miss?`<span class="stat"><b>${miss}</b> unit${miss>1?"s":""} without proof</span>`:""}${FITEMS.length?`<span class="stat"><b>${FITEMS.length}</b> problem${FITEMS.length>1?"s":""} in the existing design</span>`:""}<span class="stat"><b>${PIPE?PIPE.hunters:0}</b> hunters · <b>${PIPE?PIPE.voters:0}</b> voters per finding</span></div>${cta}</div></section>`;

  const imp = STORY.impact||[];
  if (imp.length) {
    const groups = {}; imp.forEach(i => (groups[i.who] ||= []).push(i));
    const WHO = {users:"Users", admins:"Admins", developers:"Developers", operators:"Operators", data:"Data"};
    const KIND = {added:"+", changed:"~", removed:"−", risk:"!"};
    h += `<div class="card"><h3>Who this affects</h3><div class="impact">` + Object.keys(groups).map(w => `<div class="who"><h4>${esc(WHO[w]||w)}</h4>${groups[w].map(i=>`<div class="imp"><span class="kind ${i.kind}" title="${i.kind}">${KIND[i.kind]||"·"}</span><span><b>${esc(i.area)}</b><br><span>${esc(i.change)}</span></span></div>`).join("")}</div>`).join("") + `</div></div>`;
  }
  if ((STORY.focus||[]).length) h += `<div class="card"><h3>Where your judgement matters</h3><ul class="focus">${STORY.focus.map(f=>`<li>${EYE}<span>${esc(f)}</span></li>`).join("")}</ul></div>`;

  h += `<div class="card"><h3>The path<span>${units.length} steps</span></h3><div class="path">` + units.map((u,i)=>{ const dc=(decisions[u.id]||{}).d; return `<button class="prow" data-u="${u.id}"><span class="num ${dc||""}">${dc?NUMMARK[dc]:i+1}</span><span><span class="t">${esc(u.title)}</span><span class="q">${esc(u.question || (u.tier==="static"?"No decision needed: confirm it is mechanical.":u.brief.replace(/\[\[|\]\]/g,"")))}</span></span><span class="tag ${u.tier}">${u.tier==="human"?"you":u.tier}</span></button>` }).join("") + `</div></div>`;

  h += findingsSection();
  h += `<div class="grid2"><div class="card"><h3>Not checked by anyone</h3>${list(R.not_checked)}</div><div class="card"><h3>Watch after deploy</h3>${list(R.watch_after_deploy)}</div></div>`;
  if (PIPE) h += pipeCard();
  h += `<p class="kbd">Keys: j / k move · a looks right · c needs change · q ask author · 1-4 views · s summary</p>`;
  $("#main").innerHTML = h;
  wire();
}
function gapsBanner(){
  if (!PIPE || !PIPE.incomplete) return "";
  return `<div class="card gaps"><h3 style="color:var(--bad)">Review not finished<span>these results are partial</span></h3><ul class="plain">${(PIPE.gaps||[]).map(g=>`<li><b>${esc(g.what)}</b>${g.why?` <span style="color:var(--muted)">(${esc(g.why)})</span>`:""}</li>`).join("")}</ul>${PIPE.budget?`<p style="margin-top:8px;color:var(--muted)">Budget $${PIPE.budget.toFixed(2)}${PIPE.budgetWhy?` (${esc(PIPE.budgetWhy)})`:""}. Spent $${(PIPE.costUsd||0).toFixed(2)}. Re-run with a higher budget to finish.</p>`:""}</div>`;
}
const RISK = R.merge_risk || null;
function mergeRiskCard(){
  if (!RISK) return "";
  const IC = {0:"✓", 1:"~", 2:"!"}, TIP = {alignment:"Does the code do what the PR says, and only that?", impact:"Blast radius and sensitive paths (auth, payments, migrations…)", verification:"Is each behaviour change proven by tests or before/after output?", rollback:"If it goes wrong, does a plain revert undo it? (one-way vs two-way door)", errors:"If the new code fails in production, will anyone see it?"};
  const col = {low:"var(--ok)", medium:"var(--warn)", high:"var(--bad)"}[RISK.overall];
  let h = `<div class="card mrisk"><div class="mhead"><span class="grade lv-${RISK.overall}">${esc(RISK.overall)} risk</span><div><b>${esc(RISK.summary)}</b><div class="meter" title="risk score ${RISK.score}/100"><i style="width:${Math.max(4,RISK.score)}%;background:${col}"></i></div></div></div>`;
  RISK.signals.forEach(s => {
    const lv = s.level < 0 ? null : s.level;
    const cl = (s.claims||[]).filter(c => c.status !== "skipped");
    const claim = c => `<div class="claim ${c.status==="rejected"?"rej":""}">${codeChip(c.file, c.line, c.hunk)}<b>${esc(c.title)}</b><span style="color:var(--muted)">${esc(c.status==="rejected"?"Dismissed: "+(c.reject||"verifiers disagreed"):c.why)}</span>${voteDots(c)}</div>`;
    const kept = cl.filter(c => c.status !== "rejected"), gone = cl.filter(c => c.status === "rejected");
    h += `<div class="sig" title="${esc(TIP[s.key]||"")}"><span class="ic ${lv===null?"":"lv"+lv}">${lv===null?"–":IC[lv]}</span><span class="nm">${esc(s.name)}</span><span class="gr ${lv===null?"":"lv"+lv}" style="background:none">${esc(s.grade)}</span><span class="why">${esc(s.reason||"")}</span>`;
    if (cl.length) h += `<div class="claims">${kept.map(claim).join("")}${gone.length?`<details class="dis"><summary>${gone.length} claim${gone.length>1?"s":""} dismissed by the verifiers</summary>${gone.map(claim).join("")}</details>`:""}</div>`;
    h += `</div>`;
  });
  if ((RISK.lower||[]).length) h += `<div class="lower"><b>To lower the risk</b><ul>${RISK.lower.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return h + `</div>`;
}
function list(a){ return a && a.length ? `<ul class="plain">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="empty">Nothing listed.</span>` }

/* ---------- findings ---------- */
function voteDots(f){ if(!(f.votes||[]).length) return ""; return `<span class="votes" title="${esc(f.votes.map(v=>v.lens+": "+(v.real?"real":"not real")+" — "+v.reason).join("\n"))}">${f.votes.map(v=>`<i class="${v.real?'y':'n'}"></i>`).join("")} ${f.votes.filter(v=>v.real).length}/${f.votes.length} verifiers</span>` }
function bugRow(f, opts){
  opts = opts||{};
  const cls = f.status==="fixed" ? "fixed" : f.status!=="confirmed" ? "dismissed" : !f.introduced ? "pre" : f.severity==="minor" ? "minor" : "important";
  const lbl = {important:"Bug", minor:"Minor", pre:"Pre-existing", fixed:"Fixed", dismissed: f.status==="rejected"?"Dismissed":f.status==="nit"?"Harmless":f.status==="skipped"?"Unverified":f.status}[cls];
  const loc = f.hunk ? `<button class="ev" data-jump="${f.hunk}" data-line="${f.line}" data-unit="${esc(f.unit||"")}"><b>${esc(f.id)}</b>${esc(f.file.split("/").pop())}:${f.line}</button>` : `<span class="ev"><b>${esc(f.id)}</b>${esc(f.file.split("/").pop())}:${f.line}</span>`;
  const unit = opts.unitLink && f.unit ? `<a href="#${esc(f.unit)}">${esc((units.find(u=>u.id===f.unit)||{}).title||f.unit)}</a>` : "";
  const also = (f.also_at||[]).length ? `<span>same pattern at ${f.also_at.map(a=>esc(a.file.split("/").pop()+":"+a.line)).join(", ")}</span>` : "";
  const body = cls==="dismissed" ? `<p>${esc(f.why||"")}</p>` : `<p>${esc(f.scenario)}</p>${f.fix?`<p class="fix">Fix: ${esc(f.fix)}</p>`:""}`;
  const ag = (cls==="important"||cls==="minor") ? `<span class="agree"><button class="y ${agree[f.id]==="y"?"on":""}" data-agree="${f.id}" data-v="y">Agree</button><button class="n ${agree[f.id]==="n"?"on":""}" data-agree="${f.id}" data-v="n">Not a bug</button></span>` : "";
  return `<div class="bug"><span class="sev ${cls}">${lbl}</span><div><b>${esc(f.title)}</b>${body}<div class="meta">${loc}${voteDots(f)}${unit}${also}${ag}</div></div></div>`;
}
function grouped(fs, opts){
  const byClass = {}; fs.forEach(f => (byClass[(f.bug_class||"").toLowerCase()] ||= []).push(f));
  let h = "";
  fs.forEach(f => {
    const k = (f.bug_class||"").toLowerCase(), g = byClass[k];
    if (!g) return;
    if (k && g.length > 1) h += `<div class="cls"><span class="lbl">Same pattern × ${g.length}: ${esc(g[0].bug_class)}</span>${g.map(x=>bugRow(x,opts)).join("")}</div>`;
    else h += g.map(x=>bugRow(x,opts)).join("");
    delete byClass[k];
  });
  return h;
}
function findingsSection(){
  const conf = FINDINGS.filter(f=>f.status==="confirmed"&&f.introduced).sort((a,b)=>(a.severity==="minor")-(b.severity==="minor"));
  const pre = FINDINGS.filter(f=>f.status==="confirmed"&&!f.introduced), fixed = FINDINGS.filter(f=>f.status==="fixed"), dis = FINDINGS.filter(f=>["rejected","nit","skipped"].includes(f.status));
  let h = "";
  if (PIPE && PIPE.notice) h += `<div class="notice">${esc(PIPE.notice)}</div>`;
  if (conf.length) h += `<div class="card bugs"><h3>Verified bugs in this PR<span>${conf.length}</span></h3>${grouped(conf,{unitLink:true})}</div>`;
  else if (PIPE && PIPE.voters) h += `<div class="card"><h3>Verified bugs in this PR</h3><span class="empty">None survived verification.</span></div>`;
  if (fixed.length) h += `<div class="card"><h3>Fixed since last round<span>${fixed.length}</span></h3>${fixed.map(f=>bugRow(f,{unitLink:true})).join("")}</div>`;
  if (pre.length || dis.length) {
    h += `<div class="card">`;
    if (pre.length) h += `<details class="more"><summary>Pre-existing bugs nearby (${pre.length}): not caused by this PR</summary>${pre.map(f=>bugRow(f,{unitLink:true})).join("")}</details>`;
    if (dis.length) h += `<details class="more"><summary>Checked and dismissed (${dis.length}): reported by a hunter, voted down</summary>${dis.map(f=>bugRow(f,{unitLink:true})).join("")}</details>`;
    h += `</div>`;
  }
  return h;
}
function pipeCard(){
  const p = PIPE, u = p.usage||{};
  let h = `<div class="card"><h3>How this review was made<span>${esc(p.depth)} · round ${p.round}${p.since?` · since ${esc(p.since.slice(0,7))}`:""}</span></h3>`;
  h += `<div class="pipe"><span><span class="n">${p.hunters}</span> bug hunters</span>→<span><span class="n">${p.candidates}</span> candidates</span>→<span><span class="n">${p.duplicates}</span> merged · <span class="n">${p.unverifiable}</span> dropped (quoted code not found)${p.outsideDelta?` · <span class="n">${p.outsideDelta}</span> outside the new commits`:""}</span>→<span><span class="n">${p.voters}</span> verifiers each</span>→<span><span class="n">${p.confirmed}</span> bugs · <span class="n">${p.minor||0}</span> minor · <span class="n">${p.preExisting}</span> pre-existing · <span class="n">${p.rejected+p.nits}</span> dismissed</span></div>`;
  if (p.symbols) h += `<p class="kbd" style="margin:10px 0 0">Callers of ${p.symbols} changed symbols looked up with git grep${p.verifyCmd?` · ran ${esc(p.verifyCmd)} (exit ${p.verifyExit})`:""}${p.seconds?` · ${Math.round(p.seconds/6)/10} min`:""}</p>`;
  const rows = Object.entries(u).sort();
  if (rows.length) {
    h += `<div class="tscroll"><table style="margin-top:10px"><tr><th>Stage</th><th>Calls</th><th>Input</th><th>Cached</th><th>Output</th><th>Cost</th></tr>`;
    rows.forEach(([k,s]) => { const tin = s.input+s.cacheWrite+s.cacheRead; h += `<tr><td>${esc(k)}</td><td>${s.calls}</td><td>${Math.round(tin/1000)}k</td><td>${tin?Math.round(s.cacheRead/tin*100):0}%</td><td>${Math.round(s.output/1000)}k</td><td>$${s.costUsd.toFixed(2)}</td></tr>` });
    h += `<tr><th>Total</th><td></td><td></td><td></td><td></td><th>$${(p.costUsd||0).toFixed(2)}</th></tr></table></div>`;
  }
  return h + `</div>`;
}

/* ---------- unit ---------- */
function renderUnit(u){
  const i = units.indexOf(u), s = stats(u), dc = decisions[u.id]||{};
  let h = `<div class="stephead"><span class="lbl">Step ${i+1} of ${units.length}</span><span class="tag ${u.tier}">${TIER[u.tier]}</span><span class="dots">${units.map(x=>`<i class="${(decisions[x.id]||{}).d||""} ${x===u?"cur":""}"></i>`).join("")}</span></div>`;
  h += `<h1 style="font-size:clamp(26px,3.4vw,34px)">${esc(u.title)}</h1>`;
  h += `<div class="sub"><span><span class="dot r-${u.risk}"></span> ${u.risk} risk: ${esc(u.risk_reason)}</span><span><span class="plus">+${s.a}</span> <span class="minus">−${s.d}</span> · ${u.hunks.length} hunk${u.hunks.length>1?"s":""}</span></div>`;
  const q = u.question || (u.tier==="static" ? "Is this change purely mechanical, with no behaviour change?" : "Does this behave the way the PR intends?");

  if (inn.length) h += `<p style="margin:6px 0 0"><span class="lbl">Called by</span> ${inn.map(e=>`${esc(name(e.from))}${e.label?` <span class="kbd">(${esc(e.label)})</span>`:""}`).join(", ")}</p>`;
  if ((n.files||[]).length) h += `<div style="margin-top:8px">${n.files.map(f => { const [u] = unitOfFile(f); return u ? `<button class="filebtn" data-u="${esc(u.id)}" title="Open the unit that changes this file">${esc(f.split("/").pop())} →</button>` : `<span class="filebtn" title="${esc(f)}">${esc(f.split("/").pop())}</span>`; }).join("")}</div>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-u]").forEach(b => b.onclick = () => go(b.dataset.u));
}
function flowSteps(){ const F = DESIGN.flows[flowIdx]; return F.steps.filter(s => visKind(flowMode, s.kind)) }
function stopFlow(){ if (flowTimer) { clearInterval(flowTimer); flowTimer = null; } }
function drawFlow(){
  const box = $("#flowbox"); if (!box) return;
  const F = DESIGN.flows[flowIdx], steps = flowSteps();
  flowCur = Math.max(0, Math.min(flowCur, steps.length-1));
  const cur = steps[flowCur] || {};
  let h = DESIGN.flows.length > 1 ? `<div class="ftabs">${DESIGN.flows.map((f,i)=>`<button class="ftab ${i===flowIdx?"on":""}" data-fi="${i}">${esc(f.title)}</button>`).join("")}</div>` : "";
  h += `<p style="margin:0 0 10px"><b>${esc(F.title)}</b><span style="color:var(--muted)"> · ${esc(F.trigger)}</span></p>`;
  h += `<div class="dtools"><span class="player"><button class="pbtn" data-fp="first" aria-label="Back to start">⏮</button><button class="pbtn" data-fp="prev" aria-label="Previous step">◀</button><button class="pbtn play" data-fp="play">${flowTimer?"❚❚ Pause":"▶ Play"}</button><button class="pbtn" data-fp="next" aria-label="Next step">▶</button></span><span class="kbd">Step ${flowCur+1} of ${steps.length}</span>${seg("fmode", flowMode, [["before","Before"],["after","After"],["changes","Both"]])}</div>`;
  // sequence diagram
  const LW = 170, PX = 12, TOP = 8, HD = 36, Y0 = TOP + HD + 30, ROW = 46;
  const lanes = F.lanes, lx = {}; lanes.forEach((l,i) => lx[l.id] = PX + i*LW + LW/2);
  const Wsvg = PX*2 + lanes.length*LW, Hsvg = Y0 + steps.length*ROW + 10;
  const active = new Set([cur.from, cur.to]);
  let svg = `<svg width="${Wsvg}" height="${Hsvg}" viewBox="0 0 ${Wsvg} ${Hsvg}" role="img" aria-label="Code flow: ${esc(F.title)}"><defs>${["same","added","changed","removed"].map(k=>`<marker id="fa-${k}" class="mkr-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker>`).join("")}</defs>`;
  lanes.forEach(l => { const x = lx[l.id]; svg += `<line class="life" x1="${x}" x2="${x}" y1="${TOP+HD}" y2="${Hsvg-6}"/><g class="lanehd ${active.has(l.id)?"on":""}"><rect x="${x-LW/2+8}" y="${TOP}" width="${LW-16}" height="${HD}" rx="9"/><text x="${x}" y="${TOP+23}" text-anchor="middle">${esc(trunc(l.name, 20))}</text></g>`; });
  steps.forEach((s, i) => {
    const y = Y0 + i*ROW, x1 = lx[s.from], x2 = lx[s.to]; if (x1===undefined || x2===undefined) return;
    const self = s.from === s.to;
    const d = self ? `M${x1} ${y}h40v16h-36` : `M${x1} ${y}L${x2 + (x2>x1?-4:4)} ${y}`;
    const state = i < flowCur ? "past" : i === flowCur ? "cur" : "future";
    const tx = self ? x1 + 48 : (x1+x2)/2, anchor = self ? "start" : "middle";
    svg += `<g class="fstep k-${s.kind} ${state}" data-fs="${i}"><path class="ln" d="${d}" marker-end="url(#fa-${s.kind})"/><text x="${tx}" y="${y-7}" text-anchor="${anchor}">${i+1}. ${esc(trunc(s.action, self?28:Math.max(14, Math.abs(x2-x1)/7)))}</text>`;
    if (state === "cur" && !matchMedia("(prefers-reduced-motion: reduce)").matches) svg += `<circle class="packet" r="6"><animateMotion dur="0.9s" fill="freeze" path="${d}"/></circle>`;
    svg += `</g>`;
  });
  h += `<div class="diag">${svg}</svg></div>`;
  // caption
  if (cur.action) {
    let code = "";
    if (cur.grounded && cur.hunk && unitOfHunk(cur.hunk)) code = `<div style="margin-top:10px"><button class="ev" data-jump="${esc(cur.hunk)}" data-line="${cur.line}" data-unit="${esc(unitOfHunk(cur.hunk).id)}"><b>Open code</b>${esc(cur.file.split("/").pop())}:${cur.line}</button></div>`;
    else if (cur.grounded) code = `<p class="kbd" style="margin-top:8px">Existing code at ${esc(cur.file)}:${cur.line}</p><code>${esc(cur.quote)}</code>`;
    h += `<div class="caption k-${cur.kind}"><span class="kbd">Step ${flowCur+1} of ${steps.length}</span><span class="ktag ${cur.kind}">${cur.kind==="same"?"unchanged":cur.kind}</span><div style="margin-top:4px"><b>${esc(cur.action)}</b></div><p>${esc(cur.detail)}</p>${code}</div>`;
  }
  box.innerHTML = h;
  box.querySelectorAll("[data-fi]").forEach(b => b.onclick = () => { stopFlow(); flowIdx = +b.dataset.fi; flowCur = 0; drawFlow(); });
  box.querySelectorAll("[data-fmode]").forEach(b => b.onclick = () => { stopFlow(); flowMode = b.dataset.fmode; flowCur = 0; drawFlow(); });
  box.querySelectorAll("[data-fs]").forEach(g => g.onclick = () => { stopFlow(); flowCur = +g.dataset.fs; drawFlow(); });
  box.querySelectorAll("[data-fp]").forEach(b => b.onclick = () => {
    const a = b.dataset.fp, n = flowSteps().length;
    if (a === "play") { if (flowTimer) stopFlow(); else { if (flowCur >= n-1) flowCur = 0; flowTimer = setInterval(() => { if (flowCur < flowSteps().length-1) { flowCur++; drawFlow(); } else { stopFlow(); drawFlow(); } }, 1900); } }
    else { stopFlow(); flowCur = a==="first" ? 0 : a==="prev" ? flowCur-1 : flowCur+1; }
    drawFlow();
  });
  box.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { stopFlow(); go(b.dataset.unit); view = "explained"; store.set("view", view); render(); setTimeout(()=>jump(b.dataset.jump, +b.dataset.line), 40); });
}

/* ---------- is the existing design right? ---------- */
const VERDICT_D = {sound:"Sound", questionable:"Questionable", flawed:"Flawed"};
const REC = {now:"Fix in this PR", follow_up:"Follow-up", no:"Leave it"};
function codeChip(file, line, hunk){ const u = hunk ? unitOfHunk(hunk) : null; return u ? `<button class="ev" data-jump="${esc(hunk)}" data-line="${line}" data-unit="${esc(u.id)}"><b>code</b>${esc(file.split("/").pop())}:${line}</button>` : `<span class="ev" title="${esc(file)}"><b>code</b>${esc(file.split("/").pop())}:${line}</span>` }
function pracRow(p){
  const st = p.state==="resolved" ? "resolved" : p.status;
  const lbl = {followed:"Followed", broken:"Broken", mixed:"Mixed", resolved:"Fixed"}[st];
  const tg = (p.status!=="followed" && p.state!=="resolved") ? `<button class="toggle ${pask[p.id]?"on":""}" data-pask="${esc(p.id)}">${pask[p.id]?"✕ Asked to fix":"Ask to fix"}</button>` : "<span></span>";
  return `<div class="prac"><span class="pst ${st}">${lbl}</span><div><b>${esc(p.practice)}</b><p>${esc(p.detail)}</p><div class="meta" style="display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:12px;color:var(--faint)">${codeChip(p.file, p.line, p.hunk)}${p.reference?`<span>convention: ${esc(p.reference)}</span>`:""}</div></div>${tg}</div>`;
}
function renderBase(){
  const F = DESIGN.foundations, dismissed = (F.items||[]).filter(f=>f.status==="rejected"||f.status==="skipped"), resolved = (F.items||[]).filter(f=>f.status==="resolved");
  let h = `<div class="stephead"><span class="lbl">After the units</span><span class="tag human">The base</span></div><h1 style="font-size:clamp(26px,3.4vw,34px)">Is the existing design right?</h1>`;
  h += `<p style="color:var(--muted);max-width:760px;margin:0 0 18px">This looks past the diff at the code the PR builds on: is it right, can the old code be fixed, and should this PR carry the fix?</p>`;
  h += `<div class="verdictbar ${esc(F.verdict)}"><b>${VERDICT_D[F.verdict]||F.verdict}</b><span>${esc(F.summary)}</span></div>`;
  if (FITEMS.length) {
    h += `<div class="card"><h3>Problems in the existing code<span>${FITEMS.length} verified</span></h3>` + FITEMS.map(f => `<div class="fitem"><h4>${esc(f.title)}</h4><p style="margin:0;color:var(--muted)">${esc(f.problem)}</p><div class="fgrid"><div><span class="lbl">Fix the old code</span>${esc(f.fix_old)}</div><div><span class="lbl">Bring it into this PR?</span><span class="rec ${esc(f.adopt)}">${REC[f.adopt]||f.adopt}</span> ${esc(f.adopt_how)}</div></div><div class="meta" style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--faint)">${codeChip(f.file, f.line, "")}<span>effort ${esc(f.effort)}</span>${f.risk_if_ignored?`<span>if ignored: ${esc(f.risk_if_ignored)}</span>`:""}${voteDots(f)}${f.round>1?`<span>since round ${f.round}</span>`:""}</div><div class="decide" style="margin-top:12px">${[["now","Fix in this PR"],["follow","Follow-up issue"],["none","Not a problem"]].map(([v,l])=>`<button class="dbtn ${v==="now"?"change":v==="follow"?"ask":"ok"} ${fdec[f.id]===v?"on":""}" data-fdec="${esc(f.id)}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("") + `</div>`;
  } else h += `<div class="card"><h3>Problems in the existing code</h3><span class="empty">No verified problems in the code this PR builds on.</span></div>`;
  if (resolved.length) h += `<div class="card"><h3>Resolved since an earlier round<span>${resolved.length}</span></h3>${resolved.map(f=>`<p style="margin:6px 0"><span class="pst resolved">Fixed</span> ${esc(f.title)}</p>`).join("")}</div>`;

  if (dismissed.length) h += `<div class="card"><details class="more"><summary>Checked and dismissed (${dismissed.length}): design claims the verifiers rejected</summary>${dismissed.map(f=>`<div class="fitem"><h4>${esc(f.title)}</h4><p style="margin:0;color:var(--muted)">${esc(f.why||f.problem)}</p><div style="margin-top:6px">${voteDots(f)}</div></div>`).join("")}</details></div>`;
  $("#main").innerHTML = h;
  wire();
}

/* ---------- decisions and summary ---------- */
function nextUndecided(after){
  const start = after ? units.indexOf(after)+1 : 0;
  for (let k=0; k<units.length; k++) { const u = units[(start+k)%units.length]; if (!(decisions[u.id]||{}).d) return u; }
  return null;
}
function decide(u, d){
  if (!started) { started = Date.now(); store.set("started", started); }
  const prev = decisions[u.id]||{};
  const note = $("#note-"+CSS.escape(u.id));
  decisions[u.id] = {d: prev.d===d ? "" : d, note: note ? note.value : (prev.note||"")};
  store.set("decisions", decisions);
  renderSide(); renderProgress(); renderBar();
  $("#main").querySelectorAll("[data-dec]").forEach(b => b.classList.toggle("on", b.dataset.dec===decisions[u.id].d));
  if (!decisions[u.id].d) return;
  const ob = openBugs(u);
  if (d==="ok" && ob.length) {
    toast(`${ob.length} verified bug${ob.length>1?"s":""} here: agree or overrule ${ob.length>1?"them":"it"} first`);
    if (view==="facts") { view = "guided"; store.set("view", view); render(); }
    const card = document.querySelector(".card.bugs"); if (card) card.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if ((d==="change"||d==="ask") && !(decisions[u.id].note||"").trim()) { note && note.focus(); toast(d==="change" ? "Say what needs to change, then press → to continue" : "Write your question, then press → to continue"); return; }
  const nx = nextUndecided(u);
  if (!nx) { if (HAS_BASE && baseOpen()) { toast("Units done · now: is the existing design right?"); setTimeout(()=>go("base"), 650); } else { toast("All decisions made"); setTimeout(()=>go("summary"), 450); } }
  else { toast(`${DEC[d][0]} · next: ${nx.title}`); setTimeout(()=>{ if (route===u.id) go(nx.id) }, 650); }
}
function verdictNow(){
  const conf = FINDINGS.filter(f=>f.status==="confirmed"&&f.introduced);
  const agreedBugs = conf.filter(f=>agree[f.id]==="y"&&f.severity!=="minor");
  const openImportant = conf.filter(f=>!agree[f.id]&&f.severity!=="minor");
  const ds = units.map(u=>(decisions[u.id]||{}).d);
  if (ds.includes("change") || agreedBugs.length || FITEMS.some(f=>fdec[f.id]==="now") || PRACS.some(p=>pask[p.id])) return ["change","Request changes"];
  if (openImportant.length) return ["open", `Decide on ${openImportant.length} verified bug${openImportant.length>1?"s":""} first`];
  if (ds.includes("ask") || conf.some(f=>agree[f.id]==="y")) return ["ask","Comment"];
  if (FITEMS.some(f=>fdec[f.id]==="follow")) return ["ask","Comment"];
  if (ds.every(Boolean) && !baseOpen()) return PIPE && PIPE.incomplete ? ["ask","Comment: the review did not finish"] : ["ok","Approve"];
  return ["open","In progress"];
}
function composeReview(){
  const [v, vl] = verdictNow();
  const must = [], questions = [], good = [], minor = [];
  units.forEach(u => {
    const dc = decisions[u.id]||{};
    bugsOf(u).filter(f=>f.introduced && agree[f.id]==="y").forEach(f => (f.severity==="minor"?minor:must).push(`**${f.title}** (\`${f.file}:${f.line}\`): ${f.scenario}${f.fix?` Fix: ${f.fix}`:""}`));
    if (dc.d==="change") must.push(`**${u.title}**: ${dc.note||u.question||"needs changes"}`);
    if (dc.d==="ask") questions.push(`**${u.title}**: ${dc.note||u.question}`);
    if (dc.d==="ok") good.push(u.title + (dc.note?` (${dc.note})`:""));
  });
  let t = `**Review${META.number?` of #${META.number}`:""}: ${vl}**\n\n`;
  if (must.length) t += `**Must fix**\n${must.map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n`;
  if (minor.length) t += `**Smaller issues**\n${minor.map(x=>`- ${x}`).join("\n")}\n\n`;
  const fnow = FITEMS.filter(f=>fdec[f.id]==="now"), ffol = FITEMS.filter(f=>fdec[f.id]==="follow"), pk = PRACS.filter(p=>pask[p.id]);
  if (fnow.length) t += `**Fix in this PR: the existing design**\n${fnow.map((f,i)=>`${i+1}. **${f.title}** (\`${f.file}:${f.line}\`): ${f.problem} Fix: ${f.fix_old}${f.adopt_how?` In this PR: ${f.adopt_how}`:""}`).join("\n")}\n\n`;
  if (pk.length) t += `**Follow the repo's practices**\n${pk.map(p=>`- **${p.practice}** (\`${p.file}:${p.line}\`): ${p.detail}${p.reference?` See ${p.reference}.`:""}`).join("\n")}\n\n`;
  if (questions.length) t += `**Questions**\n${questions.map(x=>`- ${x}`).join("\n")}\n\n`;
  if (ffol.length) t += `**Follow-up issues (not blocking)**\n${ffol.map(f=>`- ${f.title} (\`${f.file}:${f.line}\`): ${f.fix_old}`).join("\n")}\n\n`;
  if (good.length) t += `**Looks right**\n${good.map(x=>`- ${x}`).join("\n")}\n\n`;
  const ov = FINDINGS.filter(f=>agree[f.id]==="n").length;
  t += `<sub>Reviewed ${decided()} of ${units.length} behaviour changes with God's Eye${ov?`; ${ov} AI finding${ov>1?"s":""} overruled`:""}.</sub>`;
  return [v, t];
}
function composeDescription(){
  const who = ATTR && ATTR.agent ? `Written by an AI agent${ATTR.tool?` (${ATTR.tool})`:""} on behalf of the author, who ${ATTR.reviewed==="yes"?"has reviewed it":"has not reviewed it yet"}.` : "Written by the author.";
  let t = `${who}\n\n## Problem\n${STORY.why||"(state the problem in one paragraph)"}\n\n## What changed\n${STORY.what||R.eli5}\n\n`;
  t += units.filter(u=>u.tier!=="static").map(u=>`- **${u.title}**: ${u.brief.replace(/\[\[|\]\]/g,"")}`).join("\n") + "\n\n## Evidence\n";
  t += units.filter(u=>u.evidence&&u.tier!=="static").map(u=>`- **${u.title}** (${CT[u.change_type]||u.change_type}): ${u.evidence.status==="provided"?u.evidence.have:`${u.evidence.have&&u.evidence.have!=="none"?u.evidence.have+". ":""}**Still needed:** ${u.evidence.ask}`}`).join("\n") + "\n\n";
  if (RISK) { const sg = k => RISK.signals.find(s=>s.key===k); const im = sg("impact"), rb = sg("rollback"); t += `## Risk\n- **Merge risk:** ${RISK.overall}\n` + (im?`- **Impact:** ${im.grade}. ${im.reason}\n`:"") + (rb&&rb.level>=0?`- **Rollback cost:** ${rb.grade}. ${rb.reason}\n`:"") + "\n"; }
  const lim = [...(R.not_checked||[]).map(x=>`Not checked: ${x}`), ...(R.watch_after_deploy||[]).map(x=>`Watch after deploy: ${x}`)];
  if (lim.length) t += `## Limits\n${lim.map(x=>`- ${x}`).join("\n")}\n\n`;
  t += `## ELI5\n${R.eli5||""}`;
  return t;
}
function renderSummary(){
  const n = decided(), [v, vl] = verdictNow(), [, text] = composeReview();
  const conf = FINDINGS.filter(f=>f.status==="confirmed"&&f.introduced);
  const ag = conf.filter(f=>agree[f.id]==="y").length, ov = conf.filter(f=>agree[f.id]==="n").length, open = conf.length-ag-ov;
  const T = total();
  let h = `<span class="lbl">Summary</span><h1>${n===T?"Review complete":"Almost there"}</h1>`;
  h += `<section class="start">${ring(n, T, true)}<div><div class="verdict"><span class="vbig ${v}">${vl}</span></div><p style="margin-top:6px">${n} of ${T} decisions made${started?` in ${mins(Date.now()-started)}`:""}. ${conf.length?`${ag} of ${conf.length} verified bugs confirmed by you, ${ov} overruled${open?`, ${open} still open`:""}.`:"No verified bugs to confirm."}</p>${n<T?`<button class="cta" data-go="${nextUndecided()?nextUndecided().id:"base"}">Finish the remaining ${T-n} →</button>`:""}</div></section>`;
  const openAll = conf.filter(f=>!agree[f.id]);
  if (openAll.length) h += `<div class="card bugs"><h3>Verified bugs waiting for your call<span>${openAll.length}</span></h3>${openAll.map(f=>bugRow(f,{unitLink:true})).join("")}</div>`;
  h += `<div class="card"><h3>Your decisions</h3><div class="path">` + units.map((u,i)=>{ const dc=decisions[u.id]||{}; return `<button class="prow" data-u="${u.id}"><span class="num ${dc.d||""}">${dc.d?NUMMARK[dc.d]:i+1}</span><span><span class="t">${esc(u.title)}</span><span class="q">${dc.d?esc(DEC[dc.d][0])+(dc.note?": "+esc(dc.note):""):"Not decided yet"}</span></span><span class="tag ${u.tier}">${u.tier==="human"?"you":u.tier}</span></button>` }).join("") + `</div></div>`;
  h += `<div class="card"><h3>Your review, ready to post<span>edit freely</span></h3><textarea class="compose" id="compose">${esc(text)}</textarea><div class="decide" style="margin-top:12px"><button class="cta" style="margin:0" id="copytext">Copy review text</button>${META.number?`<button class="cta ghost" style="margin:0" id="copygh">Copy gh command</button>`:""}</div></div>`;
  h += `<div class="card"><h3>PR description, evidence-first<span>for the author</span></h3><p style="margin:0 0 10px;color:var(--muted)">A description in the "check this, not trust me" style: who did what, the problem, the proof per change, the limits, and a plain-words ending. Hand it to the author or paste it into the PR.</p><textarea class="compose" id="prdesc">${esc(composeDescription())}</textarea><div style="margin-top:12px"><button class="cta ghost" style="margin:0" id="copydesc">Copy PR description</button></div></div>`;
  h = h.replace('<span class="lbl">Summary</span>', '<span class="lbl">Summary</span>' + gapsBanner());
  $("#main").innerHTML = h;
  wire();
  $("#copydesc").onclick = () => copy($("#prdesc").value, "PR description copied");
  const ta = $("#compose");
  $("#copytext").onclick = () => copy(ta.value, "Review text copied");
  const gh = $("#copygh");
  if (gh) gh.onclick = () => { const flag = v==="change"?"--request-changes":v==="ok"?"--approve":"--comment"; copy(`gh pr review ${META.number}${META.repo?` --repo ${META.repo}`:""} ${flag} --body ${shq(ta.value)}`, "gh command copied: run it in your terminal") };
}

/* ---------- bar, routing, wiring ---------- */
function renderBar(){
  const u = units.find(x=>x.id===route);
  let h = "";
  if (u) {
    const dc = (decisions[u.id]||{}).d, i = units.indexOf(u);
    h += `<button data-nav="-1" aria-label="Previous step">←</button><span class="info">Step ${i+1}/${units.length}</span><span class="sep"></span>`;
    h += Object.entries(DEC).map(([k,[l]])=>`<button class="${k} ${dc===k?"on":""}" data-bdec="${k}">${NUMMARK[k]} <span class="lab">${l}</span></button>`).join("");
    h += `<span class="sep"></span><button data-nav="1" aria-label="Next step">→</button>`;
  } else if (route === "design") {
    const nx = nextUndecided();
    h += `<button data-go="story">← Story</button><span class="info">How it's built</span><button class="pri" data-go="${nx?nx.id:HAS_BASE?"base":"summary"}">Review the units →</button>`;
  } else if (route === "base") {
    h += `<button data-nav="-1">←</button><span class="info">${FITEMS.length-baseOpen()}/${FITEMS.length} design decisions</span><button class="pri" data-go="summary">Summary →</button>`;
  } else if (route === "summary") {
    h += `<button data-go="story">← Story</button><span class="info">${decided()}/${total()} decided</span><button class="pri" data-copy>Copy review</button>`;
  } else {
    const nx = nextUndecided();
    h += `<span class="info">${decided()}/${total()} decided</span><button class="pri" data-go="${startTarget()}">${decided()?"Continue":"Start review"} →</button>`;
  }
  $("#bar").innerHTML = h;
  $("#bar").querySelectorAll("[data-nav]").forEach(b => b.onclick = () => step(+b.dataset.nav));
  $("#bar").querySelectorAll("[data-bdec]").forEach(b => b.onclick = () => decide(u, b.dataset.bdec));
  $("#bar").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const c = $("#bar [data-copy]"); if (c) c.onclick = () => { const ta=$("#compose"); copy(ta?ta.value:composeReview()[1], "Review text copied") };
}
function wire(){
  const m = $("#main");
  m.querySelectorAll("[data-u]").forEach(b => b.onclick = () => go(b.dataset.u));
  m.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  m.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; store.set("view", view); render(); });
  m.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    const unit = b.dataset.unit;
    if (unit && route !== unit) { go(unit); view = "explained"; store.set("view", view); render(); }
    setTimeout(()=>jump(b.dataset.jump, +b.dataset.line), 30);
  });
  m.querySelectorAll("[data-ann]").forEach(b => b.onclick = e => { e.stopPropagation(); toggleAnn(b.dataset.ann) });
  m.querySelectorAll("[data-askproof]").forEach(b => b.onclick = () => { const u = units.find(x=>x.id===b.dataset.askproof); const dc = decisions[u.id]||{}; decisions[u.id] = {d: dc.d && dc.d!=="ok" ? dc.d : "ask", note: ((dc.note||"") + (dc.note?"\n":"") + "Please add proof: " + u.evidence.ask).trim()}; store.set("decisions", decisions); toast("Added to your questions for the author"); render(); });
  m.querySelectorAll("[data-fdec]").forEach(b => b.onclick = () => { const id = b.dataset.fdec; fdec[id] = fdec[id]===b.dataset.v ? "" : b.dataset.v; store.set("fdec", fdec); if (!started) { started = Date.now(); store.set("started", started); } renderBase(); renderSide(); renderProgress(); renderBar(); if (!baseOpen() && FITEMS.length) toast("All design decisions made: see your summary"); });
  m.querySelectorAll("[data-pask]").forEach(b => b.onclick = () => { const id = b.dataset.pask; pask[id] = !pask[id]; store.set("pask", pask); b.classList.toggle("on", !!pask[id]); b.textContent = pask[id] ? "✕ Asked to fix" : "Ask to fix"; });
  const all = m.querySelector("[data-annall]");
  if (all) all.onclick = () => { const rows = [...m.querySelectorAll("tr.ann")]; const open = rows.some(r => r.hidden); rows.forEach(r => toggleAnn(r.id.slice(2), open)); all.textContent = open ? "Close all explanations" : `Open all ${rows.length} explanations`; };
  m.querySelectorAll("[data-agree]").forEach(b => b.onclick = () => {
    const id = b.dataset.agree; agree[id] = agree[id]===b.dataset.v ? "" : b.dataset.v; store.set("agree", agree);
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", agree[id]===x.dataset.v));
    if (!started) { started = Date.now(); store.set("started", started); }
    toast(agree[id]==="y" ? "Added to your review" : agree[id]==="n" ? "Overruled: left out of your review" : "Cleared");
    if (route === "summary") setTimeout(renderSummary, 250);
    else renderSide();
  });
}
function routes(){ return ["story", ...(DESIGN?["design"]:[]), ...units.map(u=>u.id), ...(HAS_BASE?["base"]:[]), "summary"] }
function step(d){ const ids = routes(); let i = ids.indexOf(route)+d; i = Math.max(0, Math.min(ids.length-1, i)); go(ids[i]) }
function go(r){ if (location.hash.slice(1) !== r) location.hash = r; else { route = r; render(); } document.body.classList.remove("navopen"); }
function render(){
  renderSide(); renderProgress();
  const u = units.find(x=>x.id===route);
  if (route !== "design") stopFlow();
  if (u) renderUnit(u); else if (route === "summary") renderSummary(); else if (route === "design" && DESIGN) renderDesign(); else if (route === "base" && HAS_BASE) renderBase(); else renderStory();
  renderBar();
}
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (route === "design") drawArch(); }, 150); });
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  route = routes().includes(h) ? h : "story";
  render(); window.scrollTo(0,0);
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const u = units.find(x=>x.id===route);
  if (e.key==="j" || e.key==="ArrowRight") step(1);
  else if (e.key==="k" || e.key==="ArrowLeft") step(-1);
  else if (e.key==="s") go("summary");
  else if (u && "1234".includes(e.key)) { view = VIEWS[+e.key-1][0]; store.set("view", view); render(); }
  else if (u && e.key==="a") decide(u, "ok");
  else if (u && e.key==="c") decide(u, "change");
  else if (u && e.key==="q") decide(u, "ask");
});
const h0 = location.hash.slice(1);
route = routes().includes(h0) ? h0 : "story";
render();
})();
</script>
